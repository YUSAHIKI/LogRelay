name: 不具合報告
description: LogRelayで発生した問題を報告します
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。位置情報、氏名、メールアドレス、写真などの個人情報は記載・添付しないでください。

  - type: input
    id: version
    attributes:
      label: LogRelayのバージョン
      description: アプリの設定画面などに表示されるバージョンを入力してください。
      placeholder: 例：0.2.0-alpha
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 端末
      description: メーカー名と機種名を入力してください。
      placeholder: 例：Google Pixel 8
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Androidバージョン
      placeholder: 例：Android 16
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: 関係する機能
      options:
        - 記録・メモ・タグ
        - ウィジェット
        - NFC
        - Wear OS連携
        - バックアップ・復元
        - 表示・操作
        - その他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を順番に記載してください。
      placeholder: |
        1. アプリを開く
        2. ○○をタップする
        3. △△が表示される
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待していた動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際に起きたこと
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 必要な場合のみ記載してください。スクリーンショットは個人情報や位置情報を隠してから添付してください。

  - type: checkboxes
    id: privacy
    attributes:
      label: プライバシー確認
      options:
        - label: 記載内容と添付ファイルに個人情報や正確な位置情報が含まれていないことを確認しました。
          required: true
